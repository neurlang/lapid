[package]
name = "lapid-web"
description = "lapid in the browser: wasm-bindgen API over lapid-hub models on WebGPU (CPU fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lapid = { workspace = true, features = ["webgpu"] }
lapid-hub.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
lapid-webgpu.workspace = true
