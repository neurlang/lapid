name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: x86_64, macos-14: arm64 (Apple Silicon), windows: x86_64 MSVC.
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/lapid-server/ui/pnpm-lock.yaml
      - name: Build web UI
        run: pnpm -C crates/lapid-server/ui install --frozen-lockfile && pnpm -C crates/lapid-server/ui build
      - name: Build
        run: cargo build --workspace --locked
      # GPU tests skip themselves when no Vulkan adapter / Metal device is present
      # (hosted runners have none), so the whole workspace runs CPU-only here.
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy (warnings allowed for now)
        run: cargo clippy --workspace --all-targets --locked
      - name: Pure-Rust dependency check
        if: runner.os == 'Linux'
        run: tools/check_pure.sh
      # lapid-c's build.rs regenerates include/lapid.h; the committed copy must match.
      - name: C header is up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code crates/lapid-c/include/lapid.h
