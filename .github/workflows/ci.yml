name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: x86_64, macos-14: arm64 (Apple Silicon), windows: x86_64 MSVC.
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      # GPU tests skip themselves when no Vulkan adapter / Metal device is present
      # (hosted runners have none), so the whole workspace runs CPU-only here.
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy (warnings allowed for now)
        run: cargo clippy --workspace --all-targets --locked
      - name: Pure-Rust dependency check
        if: runner.os == 'Linux'
        run: tools/check_pure.sh
